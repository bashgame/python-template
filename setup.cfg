[nosetests]
verbosity=2
with-spec=1
spec-color=1
with-coverage=1
cover-erase=1
cover-package=modules

[coverage:report]
show_missing = True
fail_under = 80

[coverage:run]
source = modules

[flake8]
max-line-length = 88
exclude = .git,__pycache__,build,dist

[tool:pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --tb=short
